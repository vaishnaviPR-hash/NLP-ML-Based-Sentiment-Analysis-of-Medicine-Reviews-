<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Your Medicine Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="gradient-bg text-white">
        <div class="container mx-auto px-6 py-12">
            <div class="text-center">
                <h1 class="text-5xl font-bold mb-4">✍️ Share Your Medicine Review</h1>
                <p class="text-2xl font-light mb-6">Help Others Make Informed Decisions</p>
                <p class="text-lg opacity-90 max-w-4xl mx-auto leading-relaxed">
                    Your experience matters! Share your honest review about a medicine you've used. 
                </p>
            </div>
        </div>
    </header>

    <!-- Review Form Section -->
    <section class="container mx-auto px-6 py-12">
        <div class="max-w-3xl mx-auto">
            <div class="bg-white rounded-2xl p-8 shadow-lg card-hover">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-6">
                        <span class="text-4xl">📝</span>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-800 mb-4">Write Your Review</h2>
                </div>

                <form id="reviewForm" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Your Detailed Review *</label>
                        <textarea id="reviewText" required rows="8" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Share your experience with this medicine."></textarea>
                        <p class="text-sm text-gray-500 mt-1">Minimum 100 characters</p>
                    </div>

                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-lg font-semibold text-lg transition-colors">
                        Submit Your Review
                    </button>
                </form>
            </div>

            <!-- AI Predictions -->
            <div id="aiResults" class="hidden mt-8 bg-gray-50 border border-gray-200 rounded-2xl p-8 shadow-lg">
                <h3 class="text-2xl font-bold text-gray-800 mb-4">AI Analysis Results</h3>
                <ul class="text-gray-700 space-y-2">
                    <li><strong>Overall Sentiment:</strong> <span id="resultSentiment"></span></li>
                    <li><strong>Effectiveness:</strong> <span id="resultEffectiveness"></span></li>
                    <li><strong>Price:</strong> <span id="resultPrice"></span></li>
                    <li><strong>Side Effects:</strong> <span id="resultSideEffects"></span></li>
                </ul>
            </div>
        </div>
    </section>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('reviewForm');
    const reviewTextEl = document.getElementById('reviewText');
    const aiResults = document.getElementById('aiResults');

    // Form submission
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (reviewTextEl.value.length < 100) { alert('Write at least 100 characters'); return; }

        const reviewText = reviewTextEl.value;

        try {
           const response = await fetch("/predict", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: reviewTextEl.value })
});


const result = await response.json();
const predictions = result.predictions;

// Mapping numbers to symbols + words
const sentimentMap = {
    0: { symbol: '❌', text: 'Negative' },
    1: { symbol: '➖', text: 'Neutral' },
    2: { symbol: '✅', text: 'Positive' }
};

document.getElementById('resultSentiment').textContent = 
    sentimentMap[result.predictions.overall] 
        ? `${sentimentMap[result.predictions.overall].symbol} ${sentimentMap[result.predictions.overall].text}` 
        : 'N/A';

document.getElementById('resultEffectiveness').textContent = 
    sentimentMap[result.predictions.effectiveness] 
        ? `${sentimentMap[result.predictions.effectiveness].symbol} ${sentimentMap[result.predictions.effectiveness].text}` 
        : 'N/A';

document.getElementById('resultPrice').textContent = 
    sentimentMap[result.predictions.price] 
        ? `${sentimentMap[result.predictions.price].symbol} ${sentimentMap[result.predictions.price].text}` 
        : 'N/A';

document.getElementById('resultSideEffects').textContent = 
    sentimentMap[result.predictions.side_effects] 
        ? `${sentimentMap[result.predictions.side_effects].symbol} ${sentimentMap[result.predictions.side_effects].text}` 
        : 'N/A';


            // Show AI results
            aiResults.classList.remove('hidden');
            aiResults.scrollIntoView({ behavior: 'smooth' });

        } catch (err) {
            console.error(err);
            alert('Error fetching predictions.');
        }
    });
});
</script>

</body>
</html>
